<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
</head>

  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"/></symbol>
  <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="m3 8 9 5v9"/><path d="m21 8-9 5v9"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20V7"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.03-1.56V3h4v.08A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.03H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></symbol>

  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>

  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><path d="M8 4h8l1 4H7l1-4Z"/><path d="M6 8c-2 2-3 5-3 8a5 5 0 0 0 5 5h8a5 5 0 0 0 5-5c0-3-1-6-3-8Z"/><path d="M12 11v7M9.5 13h4a1.5 1.5 0 1 1 0 3h-3a1.5 1.5 0 1 0 0 3h4"/></symbol>

  <symbol id="i-invoice" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 12h6M9 16h6"/></symbol>

  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M3 21h18M5 21V4h10v17M15 9h4v12"/><path d="M8 8h1M11 8h1M8 12h1M11 12h1M8 16h1M11 16h1"/></symbol>
</svg>

<main class="login-shell">
  <section class="login-visual" aria-label="SOP product overview"></section>
  <section class="login-side">
    <header class="login-topbar">
      <div class="product-of"><span>A Product of</span><span class="mini-s">S</span><span>PT Sinergi Bisnis Indonesia</span></div>
      <div class="language">
        <button class="lang-button" id="langButton" type="button" aria-expanded="false">
          <span class="globe-icon">◎</span><span id="languageLabel">English</span><svg><use href="#i-down"></use></svg>
        </button>
        <div class="lang-menu" id="langMenu">
          <button type="button" data-lang="English">English</button>
          <button type="button" data-lang="Bahasa Indonesia">Bahasa Indonesia</button>
        </div>
      </div>
    </header>

    <div class="mobile-login-logo">
      <div class="sop-logo"><span>S</span><i></i><span>P</span></div>
    </div>

    <form class="login-card" id="loginForm">
      <div class="login-brand">
        <div class="sop-logo large"><span>S</span><i></i><span>P</span></div>
        <div class="platform-name">Sinergi Operational Platform</div>
      </div>
      <h1>Sign In to SOP</h1>
      <p class="login-subtitle">Access your account to continue</p>

      <label class="field-label" for="email">Email Address</label>
      <div class="login-input">
        <svg><use href="#i-file"></use></svg>
        <input id="email" type="email" placeholder="yourname@company.com" autocomplete="email">
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="login-input">
        <svg><use href="#i-settings"></use></svg>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" id="passwordToggle" class="password-toggle" aria-label="Show password">◉</button>
      </div>

      <div class="remember-row">
        <label class="remember"><input type="checkbox" checked><span></span>Remember me</label>
        <button type="button" class="text-link" id="forgotPassword">Forgot password?</button>
      </div>

      <button class="signin-button" id="signinButton" type="submit"><span class="loader"></span><b>Sign In</b><span class="signin-arrow">→</span></button>
      <div class="or-divider"><span>or</span></div>

      <button type="button" class="microsoft-button" id="microsoftButton">
        <span class="ms-mark"><i></i><i></i><i></i><i></i></span>Sign in with Microsoft 365
      </button>
      <p class="account-help">Don't have an account? <button type="button" class="text-link" id="contactAdmin">Contact Administrator</button></p>
    </form>

    <footer class="login-footer">
      <span>© 2026 PT Sinergi Bisnis Indonesia. All rights reserved.</span>
      <div><strong>Stronger Operations<br>For a Sustainable Tomorrow</strong><i></i></div>
    </footer>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
